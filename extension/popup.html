<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstrePilot</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-shell">
    <!-- Top-Right Floating Utility Pills Only (No Cluttered Header Bar) -->
    <div class="floating-top-bar">
      <div class="utility-pill-group">
        <button id="btn-top-dashboard" class="pill-icon-btn" type="button" title="Open AstreWork Dashboard" aria-label="Dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          </svg>
        </button>
        <button id="btn-top-shield" class="pill-icon-btn" type="button" title="AstreShield Protection" aria-label="AstreShield">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </button>
        <button id="btn-top-settings" class="pill-icon-btn" type="button" title="Settings" aria-label="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>

      <div class="utility-pill-group">
        <button id="btn-top-logout" class="pill-icon-btn pill-btn-danger" type="button" title="Sign Out" aria-label="Sign Out">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
        <button id="btn-top-close" class="pill-icon-btn" type="button" title="Close" aria-label="Close">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Single Centered Brand Logo (Never Repeated) -->
    <div class="brand-center">
      <img src="astrework-brand.png" alt="AstreWork" class="brand-logo">
    </div>

    <!-- Main Content -->
    <main class="main">
      <!-- Loading View -->
      <div id="view-loading" class="view">
        <div class="spinner-pulse" aria-hidden="true"></div>
      </div>

      <!-- Ultra-Clean Minimalist Login View -->
      <div id="view-setup" class="view hidden">
        <form id="login-form" class="login-form" novalidate>
          <div class="input-icon-wrap">
            <svg class="input-icon-left" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input type="email" id="input-email" placeholder="Email Address" class="text-input" autocomplete="email" spellcheck="false" required>
          </div>

          <div class="input-icon-wrap">
            <svg class="input-icon-left" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="input-password" placeholder="Password" class="text-input" autocomplete="current-password" spellcheck="false" required>
            <button type="button" id="btn-toggle-password" class="input-icon-right" title="Show / Hide Password" aria-label="Toggle password visibility">
              <svg id="icon-eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="icon-eye-hide" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" x2="22" y1="2" y2="22"></line>
              </svg>
            </button>
          </div>

          <div id="login-error-msg" class="auth-error-msg hidden"></div>

          <button id="btn-login" class="btn-blue-tactile" type="submit">
            <span id="btn-login-text">Login</span>
          </button>
        </form>

        <div class="signup-row">
          <span>New Here?</span>
          <a href="https://astrework.app/register" id="link-signup" class="accent-link">Sign Up</a>
        </div>

        <div class="social-badges-row">
          <button id="btn-social-google" class="social-pill-btn" type="button" title="Continue with Google">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
          </button>

          <button id="btn-social-github" class="social-pill-btn" type="button" title="Continue with GitHub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Connected View (Clean Candidate Cockpit) -->
      <div id="view-connected" class="view hidden">
        <div class="profile-card">
          <div class="avatar-wrap">
            <div class="avatar" id="user-avatar" aria-label="Candidate Initials">AW</div>
            <span class="avatar-online-dot" aria-hidden="true"></span>
          </div>
          <div class="profile-info">
            <h2 id="user-name" class="user-name" title="Candidate Name">Candidate</h2>
            <p id="user-title" class="user-title" title="Target Role">Software Developer</p>
          </div>
        </div>

        <div class="ats-radar-card" id="ats-radar-card">
          <div class="ats-indicator-wrap">
            <span class="ats-radar-pulse" aria-hidden="true"></span>
            <span id="ats-engine-label" class="ats-engine-label">Ready on Job Page</span>
          </div>
          <div class="astreshield-badge" id="astreshield-badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span>Verified</span>
          </div>
        </div>

        <div id="primed-box" class="primed-box hidden">
          <span class="primed-label">PRIMED KIT</span>
          <div id="primed-target" class="primed-target">Target Role</div>
        </div>

        <div class="action-section">
          <button id="btn-autofill-direct" class="btn-blue-tactile" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span>Autofill Application</span>
          </button>
        </div>

        <div class="kit-quick-bar">
          <button id="btn-copy-cover" class="kit-pill-btn" type="button">
            <span id="btn-copy-cover-text">Copy Cover Letter</span>
          </button>
          <button id="btn-open-resume" class="kit-pill-btn" type="button">
            <span>Resume Studio</span>
          </button>
        </div>

        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-val" id="stat-fills">0</span>
            <span class="stat-lbl">Fills</span>
          </div>
          <div class="stat-divider" aria-hidden="true"></div>
          <div class="stat-item">
            <span class="stat-val" id="stat-fields">0</span>
            <span class="stat-lbl">Fields</span>
          </div>
          <div class="stat-divider" aria-hidden="true"></div>
          <div class="stat-item">
            <span class="stat-val" id="stat-hours">0h</span>
            <span class="stat-lbl">Saved</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
