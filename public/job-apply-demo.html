<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Full-Stack Engineer — Acme Corp Application</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6fa;
      color: #1a1a24;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 40px;
      border: 1px solid #e5e8f0;
    }
    .header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid #edf0f7;
    }
    .company-tag {
      font-size: 13px;
      font-weight: 600;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      margin: 6px 0 12px;
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
    }
    .meta {
      font-size: 14px;
      color: #64748b;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .col {
      flex: 1;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    label span.req {
      color: #ef4444;
    }
    input[type="text"], input[type="email"], input[type="tel"], textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #0f172a;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: normal;
      cursor: pointer;
    }
    .btn-submit {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-submit:hover {
      background: #1e293b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="company-tag">Acme Cloud Technologies</div>
      <h1>Senior Full-Stack Engineer</h1>
      <div class="meta">Remote • Full-time • Engineering</div>
    </div>

    <form id="application-form" onsubmit="event.preventDefault(); alert('Application submitted!');">
      <div class="row">
        <div class="col form-group">
          <label for="first_name">First Name <span class="req">*</span></label>
          <input type="text" id="first_name" name="first_name" placeholder="John" required>
        </div>
        <div class="col form-group">
          <label for="last_name">Last Name <span class="req">*</span></label>
          <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-group">
        <label for="full_name">Full Legal Name</label>
        <input type="text" id="full_name" name="full_name" placeholder="John Doe">
      </div>

      <div class="row">
        <div class="col form-group">
          <label for="email">Email Address <span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>
        <div class="col form-group">
          <label for="phone">Phone Number <span class="req">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
        </div>
      </div>

      <div class="form-group">
        <label for="location">Current Location (City, Country) <span class="req">*</span></label>
        <input type="text" id="location" name="location" placeholder="e.g. San Francisco, CA" required>
      </div>

      <div class="form-group">
        <label for="linkedin">LinkedIn Profile URL</label>
        <input type="text" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/username">
      </div>

      <div class="form-group">
        <label for="github">GitHub Profile URL</label>
        <input type="text" id="github" name="github" placeholder="https://github.com/username">
      </div>

      <div class="form-group">
        <label for="portfolio">Portfolio / Personal Website</label>
        <input type="text" id="portfolio" name="portfolio" placeholder="https://yourwebsite.com">
      </div>

      <div class="form-group">
        <label for="cover_letter">Brief Summary / Cover Note</label>
        <textarea id="cover_letter" name="cover_letter" placeholder="Tell us why you are a great fit for this role..."></textarea>
      </div>

      <div class="form-group">
        <label for="screening_tech">Why do you want to work at Acme Technologies and what makes you passionate about software engineering?</label>
        <textarea id="screening_tech" name="screening_tech" placeholder="Share your thoughts..."></textarea>
      </div>

      <div class="form-group">
        <label>Are you legally authorized to work in this country?</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="work_auth" value="yes" checked> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="work_auth" value="no"> No
          </label>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Submit Application</button>
    </form>
  </div>
</body>
</html>
