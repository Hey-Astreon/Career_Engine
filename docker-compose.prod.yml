version: '3.8'

services:
  astrepilot:
    image: ghcr.io/hey-astreon/career_engine:latest
    container_name: astrepilot_web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://astrework.app}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://astrework.app}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: astrework_redis
    restart: always
    command: >
      redis-server
      --maxmemory 1024mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - astrepilot

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.45
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup

volumes:
  caddy_data:
  caddy_config:
  redis_data:
