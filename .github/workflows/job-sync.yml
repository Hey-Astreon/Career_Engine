name: 🔄 AstreWork Remote Job Sync Engine

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    name: 🌐 19-Source Discovery Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔐 Verify Turso Secrets
        run: |
          if [ -z "${{ secrets.TURSO_DATABASE_URL }}" ]; then
            echo "::error::TURSO_DATABASE_URL secret is missing in GitHub Repository Secrets!"
            echo "Add it here: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          if [ -z "${{ secrets.TURSO_AUTH_TOKEN }}" ]; then
            echo "::error::TURSO_AUTH_TOKEN secret is missing in GitHub Repository Secrets!"
            echo "Add it here: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ Turso cloud secrets successfully verified."

      - name: 🚀 Run 19-Source Scraping Engine (Direct Turso Cloud)
        run: npx tsx scripts/run-discovery-cli.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
