name: 🔄 AstreWork Remote Job Sync Engine

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    name: 🌐 19-Source Discovery Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔐 Sanitize & Verify Turso Cloud Secrets
        env:
          RAW_TURSO_URL: ${{ secrets.TURSO_DATABASE_URL }}
          RAW_TURSO_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node -e '
            const rawUrl = process.env.RAW_TURSO_URL || "";
            const rawToken = process.env.RAW_TURSO_TOKEN || "";

            const urlMatch = rawUrl.match(/(?:libsql|https?):\/\/[^\s"'\`]+/);
            if (!urlMatch) {
              console.error("::error::TURSO_DATABASE_URL secret is missing or does not contain a valid URL in GitHub Repository Secrets!");
              console.error("Add it here: https://github.com/${{ github.repository }}/settings/secrets/actions");
              process.exit(1);
            }
            let cleanUrl = urlMatch[0];
            if (cleanUrl.startsWith("https://")) cleanUrl = "libsql://" + cleanUrl.slice(8);
            if (cleanUrl.startsWith("http://")) cleanUrl = "libsql://" + cleanUrl.slice(7);

            const tokenMatch = rawToken.match(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/);
            const cleanToken = tokenMatch ? tokenMatch[0] : rawToken.trim().replace(/^[\r\n\'"]+|[\r\n\'"]+$/g, "").trim();

            if (!cleanToken) {
              console.error("::error::TURSO_AUTH_TOKEN secret is missing or empty in GitHub Repository Secrets!");
              console.error("Add it here: https://github.com/${{ github.repository }}/settings/secrets/actions");
              process.exit(1);
            }

            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_ENV, `TURSO_DATABASE_URL=${cleanUrl}\nDATABASE_URL=${cleanUrl}\nTURSO_AUTH_TOKEN=${cleanToken}\n`);
            console.log("Extracted Turso Database URL: " + cleanUrl.replace(/:\/\/.*@/, "://***@"));

            const { createClient } = require("@libsql/client");
            const client = createClient({ url: cleanUrl, authToken: cleanToken });
            client.execute("SELECT count(*) as count FROM opportunities").then(r => {
              console.log("✅ Turso Cloud Verified: Schema contains " + r.rows[0].count + " opportunities.");
            }).catch(e => {
              console.error("❌ Turso Cloud Preflight Verification Failed:", e.message);
              process.exit(1);
            });
          '

      - name: 🚀 Run 19-Source Scraping Engine (Direct Turso Cloud)
        run: npx --yes tsx scripts/run-discovery-cli.ts
        env:
          TURSO_DATABASE_URL: ${{ env.TURSO_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ env.TURSO_AUTH_TOKEN }}
          AGENT_GATEWAY_URL: https://agent.astrework.app
