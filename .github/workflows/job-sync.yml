name: 🔄 AstreWork Remote Job Sync Engine

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual on-demand sync from GitHub'

jobs:
  scrape-and-sync:
    name: 🌐 19-Source Discovery Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🚀 Ping AstreWork Scheduler API
        id: sync
        run: |
          echo "Starting 19-provider scraping cycle on AstreWork production..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 180 "https://astrework.vercel.app/api/scheduler?cron=true")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"

          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Failed with HTTP status $STATUS"
            exit 1
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: 📊 Generate Summary Report
        if: always()
        run: |
          echo "### 🔄 AstreWork Remote Job Sync Execution" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** https://astrework.vercel.app/api/scheduler" >> $GITHUB_STEP_SUMMARY
          echo "- **Providers:** 19 Active Remote Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name == 'schedule' && 'Automated Cron (Every 3 Hours)' || 'Manual Trigger' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTP Status:** \`${{ steps.sync.outputs.status || 'Failed' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
