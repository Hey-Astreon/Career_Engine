name: 🔄 AstreWork Remote Job Sync Engine

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    name: 🌐 19-Source Discovery Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔐 Sanitize & Verify Turso Cloud Secrets
        env:
          RAW_TURSO_URL: ${{ secrets.TURSO_DATABASE_URL }}
          RAW_TURSO_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/verify-turso.cjs

      - name: 🚀 Run 19-Source Scraping Engine (Direct Turso Cloud)
        run: npx --yes tsx scripts/run-discovery-cli.ts
        env:
          TURSO_DATABASE_URL: ${{ env.TURSO_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ env.TURSO_AUTH_TOKEN }}
          AGENT_GATEWAY_URL: https://agent.astrework.app
