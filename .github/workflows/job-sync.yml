name: 🔄 AstreWork Remote Job Sync Engine

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    name: 🌐 19-Source Discovery Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔐 Sanitize & Verify Turso Cloud Secrets
        run: |
          CLEAN_URL=$(echo "${{ secrets.TURSO_DATABASE_URL }}" | tr -d '\r\n"' | xargs)
          CLEAN_TOKEN=$(echo "${{ secrets.TURSO_AUTH_TOKEN }}" | tr -d '\r\n"' | xargs)

          if [ -z "$CLEAN_URL" ]; then
            echo "::error::TURSO_DATABASE_URL secret is missing in GitHub Repository Secrets!"
            echo "Add it here: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::error::TURSO_AUTH_TOKEN secret is missing in GitHub Repository Secrets!"
            echo "Add it here: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          export TURSO_DATABASE_URL="$CLEAN_URL"
          export DATABASE_URL="$CLEAN_URL"
          export TURSO_AUTH_TOKEN="$CLEAN_TOKEN"

          echo "TURSO_DATABASE_URL=$CLEAN_URL" >> $GITHUB_ENV
          echo "DATABASE_URL=$CLEAN_URL" >> $GITHUB_ENV
          echo "TURSO_AUTH_TOKEN=$CLEAN_TOKEN" >> $GITHUB_ENV

          echo "Testing Turso Cloud database schema connectivity..."
          node -e '
            const { createClient } = require("@libsql/client");
            const rawUrl = process.env.TURSO_DATABASE_URL || "";
            const url = rawUrl.startsWith("https://") ? "libsql://" + rawUrl.slice(8) : rawUrl;
            const client = createClient({ url, authToken: process.env.TURSO_AUTH_TOKEN });
            client.execute("SELECT count(*) as count FROM opportunities").then(r => {
              console.log("✅ Turso Cloud Verified: Schema contains " + r.rows[0].count + " opportunities.");
            }).catch(e => {
              console.error("❌ Turso Cloud Preflight Verification Failed:", e.message);
              process.exit(1);
            });
          '

      - name: 🚀 Run 19-Source Scraping Engine (Direct Turso Cloud)
        run: npx --yes tsx scripts/run-discovery-cli.ts
        env:
          TURSO_DATABASE_URL: ${{ env.TURSO_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ env.TURSO_AUTH_TOKEN }}
          AGENT_GATEWAY_URL: https://agent.astrework.app
