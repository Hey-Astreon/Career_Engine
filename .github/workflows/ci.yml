name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare Test Database
        run: |
          npx prisma db push --accept-data-loss
          npx tsx scripts/seed-candidate-profiles.ts
        env:
          DATABASE_URL: file:./prisma/dev.db
          TURSO_DATABASE_URL: ""
          TURSO_AUTH_TOKEN: ""

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run --fileParallelism=false 2>&1 | tee vitest.log
        env:
          DATABASE_URL: file:./prisma/dev.db
          VITEST: "true"

      - name: Save Failure Log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-failure-log
          tail -n 150 vitest.log > CI_FAILURE.txt
          git add CI_FAILURE.txt
          git commit -m "ci: capture vitest failure output"
          git push -f origin ci-failure-log

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/dev.db
