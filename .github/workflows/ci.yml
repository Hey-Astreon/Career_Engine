name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare Test Database
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run
        env:
          DATABASE_URL: file:./prisma/dev.db
          VITEST: "true"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/dev.db
